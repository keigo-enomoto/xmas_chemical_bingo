<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="Science Bingo - Christmas Lab">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0B2230"/><stop offset="1" stop-color="#07131A"/></linearGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#9BE7FF" stroke-opacity=".07"/></pattern>
<filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
<g id="sf" stroke="#9BE7FF" stroke-width="2.4" stroke-linecap="round" fill="none"><g id="arm"><path d="M0 0V-30M0 -18L-8 -26M0 -18L8 -26"/></g><use href="#arm" transform="rotate(60)"/><use href="#arm" transform="rotate(120)"/><use href="#arm" transform="rotate(180)"/><use href="#arm" transform="rotate(240)"/><use href="#arm" transform="rotate(300)"/></g>
<g id="bulb"><rect x="-4" y="-2" width="8" height="7" fill="#1d3a48"/><ellipse cx="0" cy="12" rx="7" ry="10"/></g>
</defs>
<rect width="1280" height="400" fill="url(#bg)"/>
<rect width="1280" height="400" fill="url(#grid)"/>
<g opacity=".85"><use href="#sf" transform="translate(90 120) scale(1.3)"/><use href="#sf" transform="translate(420 300) scale(.8)" opacity=".6"/><use href="#sf" transform="translate(760 70) scale(.7)" opacity=".6"/><use href="#sf" transform="translate(1210 190) scale(1)" opacity=".8"/><use href="#sf" transform="translate(600 345) scale(.55)" opacity=".5"/><use href="#sf" transform="translate(250 250) scale(.5)" opacity=".5"/></g>
<g fill="#F4FBFF" opacity=".7"><circle cx="150" cy="60" r="2"/><circle cx="330" cy="130" r="2.5"/><circle cx="520" cy="60" r="2"/><circle cx="900" cy="120" r="2"/><circle cx="1050" cy="330" r="2.5"/><circle cx="1130" cy="90" r="2"/><circle cx="700" cy="370" r="2"/><circle cx="40" cy="300" r="2"/></g>
<!-- garland -->
<path d="M0 18Q160 70 320 28T640 28T960 28T1280 20" fill="none" stroke="#2b4a3a" stroke-width="3"/>
<g filter="url(#glow)">
<g transform="translate(60 40)" fill="#FF4D5E"><use href="#bulb"/></g>
<g transform="translate(150 55)" fill="#2EE59D"><use href="#bulb"/></g>
<g transform="translate(240 56)" fill="#FFD43D"><use href="#bulb"/></g>
<g transform="translate(330 38)" fill="#FF4D5E"><use href="#bulb"/></g>
<g transform="translate(420 42)" fill="#2EE59D"><use href="#bulb"/></g>
<g transform="translate(510 56)" fill="#FFD43D"><use href="#bulb"/></g>
<g transform="translate(600 56)" fill="#FF4D5E"><use href="#bulb"/></g>
<g transform="translate(690 42)" fill="#2EE59D"><use href="#bulb"/></g>
<g transform="translate(780 38)" fill="#FFD43D"><use href="#bulb"/></g>
<g transform="translate(870 55)" fill="#FF4D5E"><use href="#bulb"/></g>
<g transform="translate(960 56)" fill="#2EE59D"><use href="#bulb"/></g>
<g transform="translate(1050 40)" fill="#FFD43D"><use href="#bulb"/></g>
<g transform="translate(1140 44)" fill="#FF4D5E"><use href="#bulb"/></g>
<g transform="translate(1230 46)" fill="#2EE59D"><use href="#bulb"/></g>
</g>
<!-- Au tile -->
<g transform="translate(110 150) rotate(-6)" filter="url(#glow)">
<rect width="150" height="170" rx="14" fill="#0B2230" stroke="#FFD43D" stroke-width="4"/>
<text x="14" y="34" font-family="Arial Black, Helvetica, sans-serif" font-size="24" fill="#FFD43D">79</text>
<text x="75" y="115" text-anchor="middle" font-family="Arial Black, Helvetica, sans-serif" font-size="78" fill="#FFD43D">Au</text>
<text x="75" y="150" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#F4FBFF">Gold</text>
</g>
<!-- flask -->
<g transform="translate(1040 150)" filter="url(#glow)">
<path d="M45 0H85M55 0V60L10 140Q0 165 25 165H105Q130 165 120 140L75 60V0" fill="none" stroke="#9BE7FF" stroke-width="4" stroke-linejoin="round"/>
<path d="M28 112Q65 98 102 112L118 140Q126 160 105 160H25Q4 160 12 140Z" fill="#2EE59D" fill-opacity=".75"/>
<circle cx="50" cy="135" r="6" fill="#F4FBFF" fill-opacity=".8"/><circle cx="75" cy="125" r="4" fill="#F4FBFF" fill-opacity=".8"/><circle cx="85" cy="145" r="5" fill="#F4FBFF" fill-opacity=".8"/>
<circle cx="70" cy="-14" r="5" fill="#9BE7FF" opacity=".7"/><circle cx="84" cy="-34" r="3" fill="#9BE7FF" opacity=".5"/>
</g>
<!-- title as plain text with generic fallbacks -->
<g text-anchor="middle" font-family="Arial Black, Helvetica, sans-serif" font-weight="900">
<text x="640" y="225" font-size="108" fill="#FF4D5E" filter="url(#soft)" opacity=".7" textLength="700" lengthAdjust="spacingAndGlyphs">Science Bingo</text>
<text x="640" y="225" font-size="108" fill="#F4FBFF" textLength="700" lengthAdjust="spacingAndGlyphs">Science Bingo</text>
</g>
<rect x="400" y="248" width="480" height="4" rx="2" fill="#2EE59D"/>
<text x="640" y="300" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="30" fill="#9BE7FF" textLength="620" lengthAdjust="spacingAndGlyphs">Element Bingo · Reaction Lottery · Lab Quiz</text>
<text x="640" y="350" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" letter-spacing="6" fill="#FFD43D">CHRISTMAS LAB</text>
</svg>
