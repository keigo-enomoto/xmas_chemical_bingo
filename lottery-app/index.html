<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>REACTION LOTTERY | 化学反応くじ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Orbitron:wght@700;900&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 背景の泡（CSSのみ） -->
  <div class="bg" aria-hidden="true">
    <span style="left:8%;--s:26px;--d:14s;--w:0s"></span><span style="left:22%;--s:14px;--d:11s;--w:-4s"></span>
    <span style="left:38%;--s:34px;--d:18s;--w:-9s"></span><span style="left:55%;--s:18px;--d:12s;--w:-2s"></span>
    <span style="left:70%;--s:30px;--d:16s;--w:-7s"></span><span style="left:84%;--s:12px;--d:10s;--w:-5s"></span>
    <span style="left:93%;--s:22px;--d:15s;--w:-11s"></span>
  </div>
  <canvas id="fx" aria-hidden="true"></canvas>
  <div id="flash" aria-hidden="true"></div>

  <header class="top">
    <h1><span class="en">REACTION LOTTERY</span><span class="ja">化学反応くじ</span></h1>
    <div class="tools">
      <button type="button" id="muteBtn" class="icon-btn" aria-pressed="false" aria-label="効果音をミュートする">🔊</button>
      <button type="button" id="fsBtn" class="icon-btn" aria-label="全画面表示に切り替える">⛶</button>
    </div>
  </header>

  <main id="main">
    <section class="panel config" aria-labelledby="cfgTitle">
      <h2 id="cfgTitle">試薬の量（当選人数）を設定</h2>
      <div class="row"><label for="firstCount">1等（Au 金）</label><input type="number" id="firstCount" value="1" min="0" inputmode="numeric" aria-describedby="configError"></div>
      <div class="row"><label for="secondCount">2等（Ag 銀）</label><input type="number" id="secondCount" value="3" min="0" inputmode="numeric" aria-describedby="configError"></div>
      <div class="row"><label for="thirdCount">3等（Cu 銅）</label><input type="number" id="thirdCount" value="5" min="0" inputmode="numeric" aria-describedby="configError"></div>
      <div id="configError" class="error" role="alert"></div>
      <button type="button" id="initButton" class="btn">設定を反映</button>
    </section>

    <section class="panel lab" aria-labelledby="labTitle">
      <h2 id="labTitle">残り当選枠</h2>
      <div class="flasks">
        <div class="flask t0" role="group" aria-label="1等 Au 金の試験管">
          <div class="tile"><span class="an">79</span><span class="sym">Au</span><span class="nm">金</span></div>
          <div class="glass"><div class="liquid"></div><div class="mol"></div></div>
          <p class="fname">1等</p><p class="left">残り <b class="cnt">0</b></p>
        </div>
        <div class="flask t1" role="group" aria-label="2等 Ag 銀の試験管">
          <div class="tile"><span class="an">47</span><span class="sym">Ag</span><span class="nm">銀</span></div>
          <div class="glass"><div class="liquid"></div><div class="mol"></div></div>
          <p class="fname">2等</p><p class="left">残り <b class="cnt">0</b></p>
        </div>
        <div class="flask t2" role="group" aria-label="3等 Cu 銅の試験管">
          <div class="tile"><span class="an">29</span><span class="sym">Cu</span><span class="nm">銅</span></div>
          <div class="glass"><div class="liquid"></div><div class="mol"></div></div>
          <p class="fname">3等</p><p class="left">残り <b class="cnt">0</b></p>
        </div>
      </div>

      <div class="stage">
        <div id="shock" aria-hidden="true"></div>
        <div id="result" class="result">設定を反映してください</div>
        <p id="notice" class="notice"></p>
        <button type="button" id="drawButton" class="btn draw" disabled>抽選する</button>
        <p class="hint">スペースキー / Enterキーでも抽選できます</p>
      </div>
    </section>

    <section class="panel history" aria-labelledby="histTitle">
      <h2 id="histTitle">当選履歴</h2>
      <ol id="history"></ol>
    </section>
  </main>

  <div id="announce" class="sr-only" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
